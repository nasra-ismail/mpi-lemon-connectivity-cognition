name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate hook configuration
        run: pre-commit validate-config
      - name: Validate commit convention
        run: |
          cz check --message "ci: validate commit convention"
          if cz check --message "invalid commit message" >/dev/null 2>&1; then
            echo "::error::Commitizen accepted an invalid commit message"
            exit 1
          fi
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q
