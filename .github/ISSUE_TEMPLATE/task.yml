name: Analysis task
description: Propose one auditable learning, data, statistical, or modeling task
title: "[P?] "
labels:
  - enhancement
assignees:
  - xamdoo
body:
  - type: checkboxes
    id: safety
    attributes:
      label: Data-safety confirmation
      options:
        - label: I will not attach participant-level data, MRI files, connectivity matrices, credentials, or restricted files.
          required: true
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options:
        - P0 — Foundation
        - P1 — Connectivity audit
        - P2 — Atlas and segregation
        - P3 — Behavior and sample
        - P4 — Statistics and graphs
        - P5 — Prediction
        - P6 — fMRI pilot
        - P7 — Portfolio
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: State the single result this task should produce.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why this matters
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link blocked-by or follow-up issues.
  - type: textarea
    id: inputs_outputs
    attributes:
      label: Planned inputs and outputs
      description: Name expected local inputs and permitted repository outputs without attaching source data.
  - type: textarea
    id: tasks
    attributes:
      label: Task checklist
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      value: "- [ ] Code/notebook and outputs are linked\n- [ ] Quality checks pass\n- [ ] Interpretation and limitations are written"
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and interpretation limits
      description: Note leakage, motion, missingness, multiplicity, privacy, or causal-language risks.
